# Reference only — not applied by default. Copy/adapt this per MySQL
# instance (or any other Service that needs its own IP:port MetalLB
# couldn't give it via Klipper, which shares node ports).
#
# Three MySQL instances all on 3306, each with a stable address:
#   mysql-1 -> 192.168.2.221:3306
#   mysql-2 -> 192.168.2.222:3306
#   mysql-3 -> 192.168.2.223:3306
# (.220 left free here for Traefik — see MIGRATING-FROM-KLIPPER.md)
apiVersion: v1
kind: Service
metadata:
  name: mysql-1
  annotations:
    # Pins this exact IP from homelab-pool instead of taking whatever's
    # next free — without this, autoAssign still works, but the address
    # could change if the Service is ever deleted and recreated.
    metallb.universe.tf/loadBalancerIPs: "192.168.2.221"
spec:
  type: LoadBalancer
  selector:
    app: mysql-1
  ports:
    - port: 3306
      targetPort: 3306
