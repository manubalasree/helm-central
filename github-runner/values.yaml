github:
  repository: "your-org/your-repo"
  runnerLabels:
    - self-hosted
    - linux
    - x64

runner:
  replicaCount: 1
  image:
    repository: ghcr.io/actions/actions-runner
    tag: "2.325.0"
    pullPolicy: IfNotPresent

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1
      memory: 1Gi

  nodeSelector: {}
  tolerations: []
  affinity: {}

secret:
  create: false
  name: "github-runner-token"
  tokenKey: "github_token"

nameOverride: ""
fullnameOverride: ""
