apiVersion: v1
kind: Pod
metadata:
  name: {{ include "ministack.fullname" . }}-test-health
  labels:
    {{- include "ministack.labels" . | nindent 4 }}
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: curl
      image: curlimages/curl:8.10.1
      command:
        - curl
        - --fail
        - "http://{{ include "ministack.fullname" . }}:{{ .Values.service.port }}{{ .Values.probes.readiness.path }}"
  restartPolicy: Never
