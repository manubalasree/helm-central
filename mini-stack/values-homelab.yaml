# Overlay for running MiniStack on the 3-node k3s cluster (k8s-rancher-homelab)
# and reaching it from another machine on the LAN via Ingress, the same way
# rancher.home.arpa already works.
#
# Usage:
#   helm install ministack . -f values-homelab.yaml
#   helm upgrade ministack . -f values-homelab.yaml
#
# Before installing, add a Pi-hole Local DNS Record (same place
# rancher.home.arpa is defined — Settings -> Local DNS Records on the
# controller VM's Pi-hole admin, http://192.168.2.204:8080/admin):
#   ministack.home.arpa -> 192.168.2.204
# (192.168.2.204 is the controller VM itself, same target as
# rancher.home.arpa — Pi-hole resolves the name to that host, then
# nginx-lb's :80/:443 forwards to Traefik, which routes on the Host header
# below. Not the MetalLB pool IP — Traefik is only reachable through
# nginx-lb from off-cluster clients right now, per
# ../metallb/MIGRATING-FROM-KLIPPER.md.)

ingress:
  enabled: true
  # k3s ships Traefik by default; switch to "nginx" if this cluster runs
  # RKE2 (whose default is ingress-nginx) or a standalone nginx controller.
  className: traefik
  hosts:
    - host: ministack.home.arpa
      paths:
        - path: /
          pathType: Prefix

# Base values.yaml is sized for a throwaway pod (250m/512Mi request,
# 1 CPU/1Gi limit) — bumped up here since this runs on real cluster
# hardware, not a laptop.
resources:
  requests:
    cpu: "1"
    memory: 2Gi
  limits:
    # Half of a node (~4 CPU/node across the 3-node/12-CPU cluster), well
    # above the 1 CPU request, leaving headroom for whatever else k3s
    # schedules onto the same node.
    cpu: "2"
    memory: 4Gi

# A real VM, not a throwaway local pod — keep MiniStack's state across
# pod restarts instead of losing it every time the container is rescheduled.
persistence:
  enabled: true

# Merges with (doesn't replace) the base env map in values.yaml — tells
# MiniStack to actually write its state to the volume mounted above.
env:
  PERSIST_STATE: "1"
  STATE_DIR: /tmp/ministack-state
